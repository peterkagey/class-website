<blockquote>
  <p>
    Given that \(a,b,c,d\) and, \(e\) are real numbers such that \[
      \begin{align*}
        a+b+c+d+e &=8 \quad \text{and}
        \\
        a^2+b^2+c^2+d^2+e^2&=16,
      \end{align*}
    \]
    determine the maximum value of $e$.
  </p>
  <cite>
    USAMO 1978,
    <a href="https://artofproblemsolving.com/wiki/index.php/1978_USAMO_Problems">Problem 1</a>
  </cite>
</blockquote>
