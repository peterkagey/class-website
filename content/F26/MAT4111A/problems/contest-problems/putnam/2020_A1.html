<blockquote>
  <p>
    How many positive integers \(N\) satisfy all of the following three conditions?
    <ol>
      <li>\(N\) is divisible by 2020.</li>
      <li>\(N\) has at most 2020 decimal digits.</li>
      <li>The decimal digits of \(N\) are a string of consecutive ones followed by a string of consecutive zeros.</li>
    </ol>
  </p>
  <cite>
    2020 Putnam Exam, <a href="https://kskedlaya.org/putnam-archive/2020.pdf">Problem A1</a>
  </cite>
</blockquote>
